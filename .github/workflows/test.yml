name: test

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test_audit.sh

  ubuntu-gawk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test_audit.sh

  ubuntu-mawk:
    # pins the mawk case specifically: it's Debian/Ubuntu's default `awk`
    # and historically the strictest implementation this script touches.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # mawk ships with every Ubuntu image (priority: required); shadowing
      # `awk` on PATH pins it without root.
      - name: put mawk first on PATH as awk
        run: |
          mkdir -p "$RUNNER_TEMP/awkbin"
          ln -s "$(command -v mawk)" "$RUNNER_TEMP/awkbin/awk"
          echo "$RUNNER_TEMP/awkbin" >> "$GITHUB_PATH"
      - run: awk -W version 2>&1 | head -1 | grep -q mawk
      - run: bash scripts/test_audit.sh
